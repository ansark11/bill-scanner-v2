[project]
name = "bill-wrangler-backend"
version = "0.1.0"
description = "Bill Wrangler FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "supabase>=2.4.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.125.0",
    "pdfplumber>=0.11.0",
    "google-genai>=1.0.0",
    "resend>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
